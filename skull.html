<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BHAAA YOU GOT CAUGHT</title>
    <link rel="stylesheet" href="style.css">

    <style>
  #texts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
  }

  .troll-text {
    position: absolute;
    font-family: Impact, Arial Black, sans-serif;
    font-weight: 900;
    animation: wiggle 0.2s infinite alternate;
    white-space: nowrap;
  }

  @keyframes wiggle {
    from { transform: rotate(-3deg); }
    to   { transform: rotate(3deg); }
  }
</style>

  </head>

<body>

  <div class="wholeskull">
    <div class="skull">
      <div class="top">
        <div class="horn"></div>
      </div>
      <div class="bottom">
        <div class="white"></div>
        <div class="teeth">
          <div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div>
        </div>
      </div>
      <div class="eyes">
        <div class="iris">
          <div class="eyeball"></div>
        </div>
      </div>
    </div>
    <div class="mouth"></div>
  </div>

  <div class="shadow"></div>

  <!-- Zone pour les textes -->
  <div id="texts"></div>


  <!-- Script pour les messages -->
  <script>
    const messages = [
      "Tu t'es fait avoir !!",
      "J'AI TES IDENTIFIANTS !!",
      "HAHAHA TU CLIQUES TROP VITE",
      "TROP SIMPLE !",
      "OH NON... 🤡",
      "TU ES FINI.",
      "C'ÉTAIT UN PIÈGE.",
      "PERDU !!"
    ];

    document.body.addEventListener("click", () => {
      const div = document.createElement("div");
      div.className = "troll-text";
      div.innerText = messages[Math.floor(Math.random() * messages.length)];

      // Taille aléatoire
      const size = 20 + Math.random() * 50;
      div.style.fontSize = size + "px";

      // Couleur aléatoire
      div.style.color = `hsl(${Math.random() * 360}, 90%, 60%)`;

      // Position aléatoire
      div.style.left = Math.random() * window.innerWidth + "px";
      div.style.top = Math.random() * window.innerHeight + "px";

      // Rotation forte aléatoire
      const rot = (Math.random() * 60 - 30);
      div.style.transform = `rotate(${rot}deg)`;

      // Ajout au DOM
      document.getElementById("texts").appendChild(div);

      // Disparition progressive
      setTimeout(() => {
        div.style.transition = "1s";
        div.style.opacity = 0;
        setTimeout(() => div.remove(), 1500);
      }, 800);
    });
  </script>

</body>
</html>
