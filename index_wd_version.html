<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Sign Up</title>
    <style>
      @import url("https://fonts.googleapis.com/css?family=Fira+Sans");

      .banner {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: #fdf2e9;
        padding: 20px 30px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .banner .logo {
        height: 80px;
        width: auto;
      }

      html,
      body {
        position: relative;
        min-height: 100vh;
        background-color: #e1e8ee;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 100px 20px 20px;
        font-family: "Fira Sans", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        box-sizing: border-box;
      }

      .form-structor {
        background-color: #222;
        border-radius: 20px;
        height: 700px;
        width: 450px;
        max-width: 95vw;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }

      .form-structor::after {
        content: "";
        opacity: 0.8;
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        background-image: url(https://img.industryweek.com/files/base/ebm/industryweek/image/2020/11/teamwork.5fac15b5571ee.png?auto=format,compress&fit=fill&fill=blur&w=1200&h=630);
      }

      .form-structor .signup {
        position: absolute;
        top: 50%;
        left: 50%;
        -webkit-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        width: 65%;
        max-height: 90%;
        overflow-y: auto;
        z-index: 5;
      }

      .form-structor .signup .form-title {
        color: #fff;
        font-size: 2em;
        text-align: center;
        margin-bottom: 10px;
      }

      .form-structor .signup label {
        color: #fff;
        font-size: 15px;
        margin-bottom: 12px;
        display: block;
        text-align: center;
        font-weight: 500;
      }

      .form-structor .signup select {
        border: 0;
        outline: none;
        box-shadow: none;
        display: block;
        height: 48px;
        line-height: 30px;
        padding: 12px 18px;
        width: 100%;
        font-size: 14px;
        background-color: #fff;
        border-radius: 15px;
        margin-bottom: 20px;
        color: rgba(0, 0, 0, 0.8);
        font-family: "Fira Sans", Helvetica, Arial, sans-serif;
        cursor: pointer;
      }

      .form-structor .signup .form-holder {
        border-radius: 15px;
        background-color: #fff;
        overflow: hidden;
        margin-top: 25px;
      }

      .form-structor .signup .form-holder .input {
        border: 0;
        outline: none;
        box-shadow: none;
        display: block;
        height: 40px;
        line-height: 40px;
        padding: 12px 18px;
        border-bottom: 1px solid #eee;
        width: 100%;
        font-size: 14px;
      }

      .form-structor .signup .form-holder .input:last-child {
        border-bottom: 0;
      }

      .form-structor .signup .form-holder .input::-webkit-input-placeholder {
        color: rgba(0, 0, 0, 0.4);
      }

      .form-structor .signup .submit-btn {
        background-color: rgba(0, 0, 0, 0.4);
        color: rgba(256, 256, 256, 0.9);
        border: 0;
        border-radius: 15px;
        display: block;
        margin: 20px auto;
        padding: 16px 45px;
        width: 100%;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: center;
        text-decoration: none;
        box-sizing: border-box;
      }

      .form-structor .signup .submit-btn:hover {
        background-color: rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
